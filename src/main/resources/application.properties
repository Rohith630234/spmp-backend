# ==============================================================================
# Spring Boot 3 Configuration: Student Project Management Portal (Backend)
# ==============================================================================

# Server Configuration
server.port=${PORT:8080}
server.error.include-message=always

server.error.include-binding-errors=always

# ------------------------------------------------------------------------------
# Active Database Configuration: Fast In-Memory Database (Zero-Lock H2)
# Eliminates all file-locking conflicts and starts instantly on any machine
# Web SQL Console available at http://localhost:8080/h2-console
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:college_project_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# JPA / Hibernate ORM Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# Alternative: MySQL 8.0+ Configuration (Uncomment below and comment H2 lines above)
# ------------------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/college_project_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ------------------------------------------------------------------------------
# H2 In-Memory Fallback Console (Access at http://localhost:8080/h2-console)
# ------------------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ------------------------------------------------------------------------------
# JWT (JSON Web Token) Security Settings
# Secret is a 256-bit base64 hex string compatible with HMAC-SHA256
# ------------------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-milliseconds=86400000

# ------------------------------------------------------------------------------
# File Upload Settings (PDFs, PPTs, ZIP submissions)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=uploads
